      window.addEventListener('message', (event) => {
        console.log('Получено сообщение из iframe:', event.data)
        // Здесь вы можете обработать полученные данные

        if (window.frontpostapi) {
          console.log('post html active')

            console.log('Result in post html', result)
            setTimeout(() => {
            //   console.log('post html отправляет данные  в iframe:', result)

        }
