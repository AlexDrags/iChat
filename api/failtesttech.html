<!doctype html>
<html lang="en">
  <body>
    <script type="module" src="failtesttechapi.js"></script>
    <script type="module">

      if (window.failtesttechapi) {
        console.log('failtesttech html active')
        ;(async function patch() {
          const result = await window.failtesttechapi.call()
          console.log(
            'failtesttech html отправляет данные  в parrent frame:',
            window.parent,
            result,
          )
            window.parent.postMessage(
                {
                  resResult: result['records'],
                },
                '*',
              )
          setTimeout(() => {
            document.body.innerHTML = '<pre>' + JSON.stringify(result['records'][0], null, 2) + '</pre>'
          }, 500)
        })()
      }
    </script>
  </body>
</html>
