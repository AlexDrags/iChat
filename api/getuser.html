<!DOCTYPE html>
<html lang="en">
<body>
     <script type="module" src="getusersapi.js"></script>
    <script type="module">
        console.log('Iframe getuser html loaded')
        if (window.frontgetusersapi) {
        ;(async function getuser() {
          const result = await window.frontgetusersapi.call()
          console.log('Result in getusers html', result)
          setTimeout(() => {
            console.log('getusers html отправляет данные  в parrent frame:', window.parent, result)
            window.parent.postMessage(
              {
                userList: result['users'],
              },
              '*',
            )
            document.body.innerHTML =
              '<pre>' +
              JSON.stringify(
                {
                  userList: result['users'],
                },
                null,
                2,
              ) +
              '</pre>'
          }, 500)
        })()
      }
    </script>
</body>
</html>
